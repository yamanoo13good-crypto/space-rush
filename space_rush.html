<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPACE RUSH</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%, #0a0a2a 0%, #000 70%);}
  canvas{touch-action:none;box-shadow:0 0 80px rgba(90,140,255,.3);border-radius:10px;background:#000;max-width:98vw;max-height:96vh;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 960, H = 600;

// ================= persistence =================
let HIGH = parseInt(localStorage.getItem('spaceRushHigh') || '0', 10);
const SETTINGS = Object.assign({sfxVol:0.7, musicVol:0.4, autofire:false, shake:true, particles:true, ship:0},
  JSON.parse(localStorage.getItem('spaceRushSettings')||'{}'));
function saveSettings(){ localStorage.setItem('spaceRushSettings', JSON.stringify(SETTINGS)); }
let CAMPAIGN = Object.assign({unlocked:1, stars:{}}, JSON.parse(localStorage.getItem('spaceRushCampaign')||'{}'));
function saveCampaign(){ localStorage.setItem('spaceRushCampaign', JSON.stringify(CAMPAIGN)); }

// ================= audio =================
let AC=null, master=null, musicGain=null, musicTimer=null, mstep=0;
function initAudio(){
  if(!AC){ try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=SETTINGS.sfxVol; master.connect(AC.destination);
    musicGain=AC.createGain(); musicGain.gain.value=SETTINGS.musicVol; musicGain.connect(AC.destination);
    startMusic();
  }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(f,d,type,v,slide,gain){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,AC.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    g.gain.setValueAtTime(v||0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g); g.connect(gain||master); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
function mnote(f,d,type,v){ beep(f,d,type,v,0,musicGain); }
function startMusic(){
  if(musicTimer||!AC) return;
  const mel=[0,3,5,7,10,12,10,7], bass=[0,0,5,3];
  musicTimer=setInterval(()=>{
    if(!AC) return;
    const inGame=(state==='playing')?1:0.45;
    const base=98*Math.pow(2, (WORLDS[curWorld]!==undefined&&state==='playing')?curWorld*0.0:0);
    if(mstep%2===0) mnote(base*Math.pow(2,mel[(mstep/2)%8|0]/12), .24,'triangle', .16*inGame);
    if(mstep%8===0) mnote(base/2*Math.pow(2,bass[(mstep/8)%4]/12), .5,'sine', .22*inGame);
    if(mstep%8===6) mnote(base*2*Math.pow(2,mel[((mstep/2)+3)%8|0]/12), .12,'sine', .07*inGame);
    mstep++;
  }, 240);
}
const sfx={
  click(){beep(700,.06,'square',.09,-150);},
  hover(){beep(950,.03,'sine',.04);},
  shoot(){beep(900,.07,'square',.05,-550);},
  boom(){beep(110,.32,'sawtooth',.18,-70); beep(55,.4,'triangle',.15,-25);},
  hit(){beep(220,.12,'sawtooth',.1,-120);},
  hurt(){beep(160,.28,'sawtooth',.2,-120);},
  coin(){beep(1250,.07,'sine',.09,200);},
  power(){beep(520,.1,'sine',.14); setTimeout(()=>beep(780,.14,'sine',.14),90);},
  shieldHit(){beep(300,.1,'sine',.1);},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.15),i*140));},
  over(){beep(400,.35,'triangle',.16,-280); setTimeout(()=>beep(300,.5,'triangle',.16,-220),280);}
};

// ================= helpers =================
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
const TAU=Math.PI*2;

// ================= ships =================
const SHIPS=[
 {name:'FALCON', desc:'Balanced fighter', c1:'#eaf6ff', c2:'#5f86ad', accent:'#5ab0ff', eng:'#78dcff', r:15, speed:1.0,  fire:1.0,  hp:100, variant:0},
 {name:'VIPER',  desc:'Fast & agile',     c1:'#eaffe f'.replace(' ',''), c2:'#3f8f5f', accent:'#4dff8a', eng:'#8affc0', r:13, speed:1.28, fire:1.1,  hp:80,  variant:1},
 {name:'TITAN',  desc:'Heavy armor',      c1:'#ffe8d8', c2:'#8f4f2f', accent:'#ff8a4c', eng:'#ffc078', r:19, speed:0.85, fire:0.85, hp:150, variant:2},
 {name:'PHANTOM',desc:'Rapid plasma',     c1:'#f2e8ff', c2:'#6f4fa8', accent:'#c78bff', eng:'#e0b0ff', r:14, speed:1.05, fire:1.45, hp:90,  variant:3}
];
function shipDef(){ return SHIPS[SETTINGS.ship] || SHIPS[0]; }

// ================= worlds =================
const WORLDS=[
 {name:'BLUE NEBULA',  top:'#02021c', bot:'#0a2f73', neb:'80,130,255',  rock:'#97a0b5', dark:'#5b6274', accent:'#5ab0ff'},
 {name:'VOLCANIC BELT',top:'#190404', bot:'#63160a', neb:'255,100,40',  rock:'#8a5c4e', dark:'#54332b', accent:'#ff8a4c'},
 {name:'PURPLE VOID',  top:'#0e0324', bot:'#40106a', neb:'180,90,255',  rock:'#9c86c2', dark:'#5f4d82', accent:'#c78bff'},
 {name:'DARK ABYSS',   top:'#000005', bot:'#10102a', neb:'130,150,220', rock:'#646a7d', dark:'#3a3e4d', accent:'#9db1ff'},
 {name:'CYBER GALAXY', top:'#00161a', bot:'#014554', neb:'0,230,200',   rock:'#54a39c', dark:'#2f5f5a', accent:'#2ff0d2'}
];
function worldIndex(km){ if(km>=20)return 4; if(km>=15)return 3; if(km>=10)return 2; if(km>=5)return 1; return 0; }
const nebs=[[],[],[],[],[]];
function getNeb(i){ if(!nebs[i].length){ for(let k=0;k<7;k++) nebs[i].push({x:rand(0,W),y:rand(0,H),r:rand(90,240)}); } return nebs[i]; }

// ================= levels =================
const LEVELS=[{km:3},{km:5},{km:7},{km:10},{km:13},{km:16},{km:20},{km:26}];

// ================= state =================
let state='menu', fade=1, tGlobal=0;
let MODE='endless';           // 'endless' | 'level'
let lvlIdx=0, lvlTarget=0, lcTime=0, lcStars=0;
let t=0, dist=0, km=0, score=0, speed=240, shake=0, baseSpeed=240, diffMul=1;
let banner=null, newHigh=false;
let curWorld=0;
let player, lasers, ebullets, asteroids, enemies, powerups, coins, parts, texts, planet;
let astT=0, enT=0, coinT=0, powT=0, planetT=6;
const stars=[];
for(let i=0;i<150;i++) stars.push({x:rand(0,W),y:rand(0,H),z:rand(0.25,1)});

function reset(){
  const sd=shipDef();
  t=0; dist=0; km=0; score=0; shake=0; banner=null; newHigh=false; curWorld=0;
  baseSpeed = MODE==='level' ? 225+lvlIdx*24 : 240;
  diffMul   = MODE==='level' ? 1+lvlIdx*0.14 : 1;
  player={x:140,y:H/2,r:sd.r,hp:sd.hp,maxHp:sd.hp,shield:0,inv:0,rapid:0,spread:0,magnet:0,boost:0,fireCd:0};
  lasers=[];ebullets=[];asteroids=[];enemies=[];powerups=[];coins=[];parts=[];texts=[];planet=null;
  astT=1; enT=4; coinT=2; powT=rand(5,8); planetT=8;
  if(MODE==='level'){ lvlTarget=LEVELS[lvlIdx].km; }
}

// ================= entities =================
function spawnAsteroid(){
  const r=rand(14,38), hp=r>30?3:(r>22?2:1);
  const pts=[], craters=[];
  for(let i=0;i<9;i++) pts.push(rand(0.72,1.15));
  const nc=1+Math.floor(rand(0,3));
  for(let i=0;i<nc;i++) craters.push({x:rand(-0.5,0.5),y:rand(-0.5,0.5),r:rand(0.12,0.28)});
  asteroids.push({x:W+60,y:rand(40,H-40),r,hp,maxHp:hp,rot:rand(0,TAU),vr:rand(-1.6,1.6),vx:rand(0,120),pts,craters,flash:0});
}
function spawnEnemy(){ enemies.push({x:W+50,y:rand(60,H-60),r:16,hp:3,fireT:rand(1.2,2.4),ph:rand(0,TAU),flash:0}); }
function spawnCoin(x,y){ coins.push({x:x!==undefined?x:W+30,y:y!==undefined?y:rand(40,H-40),r:9,ph:rand(0,TAU)}); }
function spawnPowerup(x,y){
  const types=['shield','rapid','spread','health','magnet','boost'];
  powerups.push({x:x!==undefined?x:W+30,y:y!==undefined?y:rand(60,H-60),type:types[Math.floor(rand(0,types.length))],r:14,ph:rand(0,TAU)});
}
function boom(x,y,color,n){
  n = SETTINGS.particles? n : Math.ceil(n/3);
  for(let i=0;i<n;i++){ const a=rand(0,TAU), s=rand(40,260);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.85),max:.85,color,size:rand(1.5,4)}); }
}
function floatText(x,y,txt,color){ texts.push({x,y,txt,color,t:1}); }

const POWTXT={shield:'SHIELD!',rapid:'RAPID FIRE!',spread:'SPREAD SHOT!',health:'+30 HP',magnet:'COIN MAGNET!',boost:'SPEED BOOST!'};
const POWCOL={shield:'#5ff2ff',rapid:'#ffe45a',spread:'#ff9a3c',health:'#6dff8a',magnet:'#7db4ff',boost:'#ff6df2'};
function applyPower(type){
  if(type==='shield')player.shield=6;
  else if(type==='rapid')player.rapid=6;
  else if(type==='spread')player.spread=8;
  else if(type==='health')player.hp=Math.min(player.maxHp,player.hp+30);
  else if(type==='magnet')player.magnet=8;
  else if(type==='boost')player.boost=4;
}

function damagePlayer(d){
  if(player.inv>0) return;
  if(player.shield>0){ player.inv=0.6; boom(player.x,player.y,'#5ff2ff',8); sfx.shieldHit(); return; }
  player.hp-=d; player.inv=1.2; shake=SETTINGS.shake?9:0; sfx.hurt();
  boom(player.x,player.y,'#ff8a5a',12);
  if(player.hp<=0){ player.hp=0; gameOver(); }
}
function gameOver(){
  state='over'; sfx.over();
  boom(player.x,player.y,'#ffffff',40);
  score=Math.floor(score);
  if(MODE==='endless' && score>HIGH){ HIGH=score; newHigh=true; localStorage.setItem('spaceRushHigh',String(HIGH)); }
}
function completeLevel(){
  state='lc'; lcTime=0; sfx.win();
  drawLC.p0=drawLC.p1=drawLC.p2=0;
  const frac=player.hp/player.maxHp;
  lcStars = frac>=0.7?3 : frac>=0.4?2 : 1;
  const key=String(lvlIdx);
  if(!(CAMPAIGN.stars[key]) || CAMPAIGN.stars[key]<lcStars) CAMPAIGN.stars[key]=lcStars;
  CAMPAIGN.unlocked=Math.max(CAMPAIGN.unlocked, lvlIdx+2);
  saveCampaign();
}

// ================= update =================
function update(dt){
  if(state!=='playing') return;
  const sd=shipDef();
  t+=dt;
  speed = baseSpeed + Math.min(430, t*9*diffMul) + (player.boost>0?150:0);
  dist += speed*dt;
  km = dist/900;
  score += speed*dt*0.02*(player.boost>0?2:1);
  const wi=worldIndex(km);
  if(wi!==curWorld){ curWorld=wi; banner={txt:'ENTERING  '+WORLDS[wi].name, t:2.6}; mstep+=8; }

  astT-=dt; if(astT<=0){ spawnAsteroid(); astT=Math.max(0.3, (1.15 - t*0.009)/diffMul); }
  enT-=dt; if(enT<=0 && km>1.2){ spawnEnemy(); enT=Math.max(1.1, (3.2 - t*0.02)/diffMul); }
  coinT-=dt; if(coinT<=0){ spawnCoin(); coinT=rand(0.9,1.6); }
  powT-=dt; if(powT<=0){ spawnPowerup(); powT=rand(6,10)/diffMul; }
  planetT-=dt; if(planetT<=0){ planet={x:W+180,y:rand(80,H-80),r:rand(60,130),sp:rand(12,30),
    c1:['#3a6fd8','#d86f3a','#8b3ad8','#3ad8c8','#d83a6f'][curWorld],c2:['#0a1c4a','#4a150a','#2a0a4a','#0a3a35','#4a0a20'][curWorld]}; planetT=rand(10,16); }

  for(const s of stars){ s.x -= speed*s.z*0.55*dt; if(s.x<0){s.x=W; s.y=rand(0,H);} }

  // movement
  const k=keys, mv=340*sd.speed;
  let dx=(k.ArrowRight||k.KeyD?1:0)-(k.ArrowLeft||k.KeyA?1:0);
  let dy=(k.ArrowDown||k.KeyS?1:0)-(k.ArrowUp||k.KeyW?1:0);
  player.x=clamp(player.x+dx*mv*dt,60,W*0.58);
  player.y=clamp(player.y+dy*mv*dt,36,H-36);
  if(touch.move){ const ty=clamp(touch.y,36,H-36), tx=clamp(touch.x,60,W*0.58);
    player.y+=(ty-player.y)*Math.min(1,dt*10); player.x+=(tx-player.x)*Math.min(1,dt*10); }
  player.inv=Math.max(0,player.inv-dt);
  player.shield=Math.max(0,player.shield-dt);
  player.rapid=Math.max(0,player.rapid-dt);
  player.spread=Math.max(0,player.spread-dt);
  player.magnet=Math.max(0,player.magnet-dt);
  player.boost=Math.max(0,player.boost-dt);
  shake=Math.max(0,shake-dt*22);

  // engine trail
  if(SETTINGS.particles && Math.random()<0.8)
    parts.push({x:player.x-14,y:player.y+rand(-3,3),vx:-speed*0.5,vy:rand(-15,15),life:rand(.15,.3),max:.3,color:sd.eng,size:rand(1.5,3)});

  // firing
  player.fireCd-=dt;
  if((k.Space||SETTINGS.autofire||touch.fire) && player.fireCd<=0){
    player.fireCd = (player.rapid>0?0.12:0.27)/sd.fire;
    const mk=(ang)=>lasers.push({x:player.x+20,y:player.y,vx:Math.cos(ang)*640,vy:Math.sin(ang)*640,r:4});
    mk(0);
    if(player.spread>0){ mk(-0.22); mk(0.22); }
    if(SETTINGS.particles) parts.push({x:player.x+22,y:player.y,vx:120,vy:0,life:.06,max:.06,color:'#fff',size:4});
    sfx.shoot();
  }

  for(let i=lasers.length-1;i>=0;i--){ const L=lasers[i]; L.x+=L.vx*dt; L.y+=L.vy*dt;
    if(L.x>W+30||L.y<-20||L.y>H+20) lasers.splice(i,1); }

  for(let i=ebullets.length-1;i>=0;i--){ const b=ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<-30||b.y<-30||b.y>H+30){ebullets.splice(i,1);continue;}
    if(player.inv<=0 && d2(b,player)<(b.r+player.r-4)*(b.r+player.r-4)){ ebullets.splice(i,1); damagePlayer(12); }
  }

  for(let i=asteroids.length-1;i>=0;i--){ const a=asteroids[i];
    a.x-=(speed+a.vx)*dt; a.rot+=a.vr*dt; a.flash=Math.max(0,a.flash-dt*5);
    if(a.x<-70){asteroids.splice(i,1);continue;}
    if(player.inv<=0 && d2(a,player)<(a.r+player.r-5)*(a.r+player.r-5)){
      asteroids.splice(i,1); boom(a.x,a.y,WORLDS[curWorld].accent,14); damagePlayer(22); continue; }
    for(let j=lasers.length-1;j>=0;j--){ const L=lasers[j];
      if(d2(a,L)<a.r*a.r){ lasers.splice(j,1); a.hp--; a.flash=1; sfx.hit();
        if(a.hp<=0){ asteroids.splice(i,1); boom(a.x,a.y,WORLDS[curWorld].rock,18); score+=50; floatText(a.x,a.y,'+50','#7df9ff'); sfx.boom();
          if(Math.random()<0.12) spawnPowerup(a.x,a.y); else if(Math.random()<0.3) spawnCoin(a.x,a.y); }
        break; } }
  }

  for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i];
    e.x-=speed*0.85*dt; e.ph+=dt*3; e.y+=Math.sin(e.ph)*40*dt; e.flash=Math.max(0,e.flash-dt*5);
    e.fireT-=dt;
    if(e.fireT<=0 && e.x<W-30 && e.x>player.x+60){
      const a=Math.atan2(player.y-e.y,player.x-e.x);
      ebullets.push({x:e.x-14,y:e.y,vx:Math.cos(a)*330,vy:Math.sin(a)*330,r:5});
      e.fireT=rand(1.5,2.6)/diffMul; beep(500,.08,'sawtooth',.05,-200);
    }
    if(e.x<-50){enemies.splice(i,1);continue;}
    if(player.inv<=0 && d2(e,player)<(e.r+player.r-3)*(e.r+player.r-3)){
      enemies.splice(i,1); boom(e.x,e.y,'#ff5a5a',18); damagePlayer(30); continue; }
    for(let j=lasers.length-1;j>=0;j--){ const L=lasers[j];
      if(d2(e,L)<e.r*e.r){ lasers.splice(j,1); e.hp--; e.flash=1; sfx.hit();
        if(e.hp<=0){ enemies.splice(i,1); boom(e.x,e.y,'#ff5a5a',22); score+=150; floatText(e.x,e.y,'+150','#ffd75a'); sfx.boom();
          if(Math.random()<0.25) spawnPowerup(e.x,e.y); }
        break; } }
  }

  for(let i=coins.length-1;i>=0;i--){ const c=coins[i];
    c.x-=speed*0.9*dt; c.ph+=dt*5;
    if(player.magnet>0){ const d=Math.sqrt(d2(c,player)); if(d<170){ c.x+=(player.x-c.x)*dt*8; c.y+=(player.y-c.y)*dt*8; } }
    if(c.x<-30){coins.splice(i,1);continue;}
    if(d2(c,player)<(c.r+player.r+8)*(c.r+player.r+8)){ coins.splice(i,1); score+=25; sfx.coin(); floatText(c.x,c.y,'+25','#ffd75a'); }
  }

  for(let i=powerups.length-1;i>=0;i--){ const p=powerups[i];
    p.x-=speed*0.75*dt; p.ph+=dt*4;
    if(p.x<-30){powerups.splice(i,1);continue;}
    if(d2(p,player)<(p.r+player.r+8)*(p.r+player.r+8)){
      powerups.splice(i,1); applyPower(p.type); sfx.power();
      floatText(p.x,p.y-16,POWTXT[p.type],POWCOL[p.type]);
    }
  }

  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.98; p.vy*=0.98; p.life-=dt; if(p.life<=0)parts.splice(i,1); }
  for(let i=texts.length-1;i>=0;i--){ const x=texts[i]; x.y-=30*dt; x.t-=dt*0.8; if(x.t<=0)texts.splice(i,1); }
  if(planet){ planet.x-=planet.sp*dt; if(planet.x<-planet.r-50)planet=null; }
  if(banner){ banner.t-=dt; if(banner.t<=0)banner=null; }

  // campaign win check
  if(MODE==='level' && km>=lvlTarget) completeLevel();
}

// ================= drawing =================
function drawBG(menu){
  const wi = menu? 0 : curWorld;
  const wd=WORLDS[wi];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,wd.top); g.addColorStop(1,wd.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='screen';
  for(const n of getNeb(wi)){
    const rg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    rg.addColorStop(0,'rgba('+wd.neb+',0.16)'); rg.addColorStop(1,'rgba('+wd.neb+',0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,TAU); ctx.fill();
  }
  ctx.restore();
  for(const s of stars){ ctx.globalAlpha=0.35+s.z*0.65; ctx.fillStyle='#fff';
    ctx.fillRect(s.x,s.y,1.4+s.z*1.6,1.4+s.z*1.6); }
  ctx.globalAlpha=1;
  if(planet && !menu){ const p=planet, rg=ctx.createRadialGradient(p.x-p.r*0.4,p.y-p.r*0.4,p.r*0.1,p.x,p.y,p.r);
    rg.addColorStop(0,p.c1); rg.addColorStop(1,p.c2);
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); }
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.85);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

function drawShipBody(x,y,def,scale,ghost){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  const fl=12+Math.random()*12;
  const fg=ctx.createLinearGradient(-12,0,-12-fl*2.4,0);
  fg.addColorStop(0,def.eng); fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.9;
  if(def.variant===2){ // twin engines
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.moveTo(-12,-11); ctx.lineTo(-12-fl*2, -8); ctx.lineTo(-12,-6); ctx.closePath(); ctx.fill();

  } else {
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.moveTo(-11,-5); ctx.lineTo(-11-fl*2.2,0); ctx.lineTo(-11,5); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
  const bg=ctx.createLinearGradient(0,-16,0,16);
  bg.addColorStop(0,def.c1); bg.addColorStop(0.55,def.c2); bg.addColorStop(1,'#233043');

  else { ctx.moveTo(24,0); ctx.lineTo(-6,-15); ctx.lineTo(-12,-4); ctx.lineTo(-12,4); ctx.lineTo(-6,15);
    ctx.moveTo(-2,-12); ctx.lineTo(-10,-20); ctx.lineTo(-11,-11);
    ctx.moveTo(-2,12); ctx.lineTo(-10,20); ctx.lineTo(-11,11); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=def.accent; ctx.lineWidth=1.4; ctx.stroke();

function drawShip(){

function drawAsteroid(a){
  const wd=WORLDS[curWorld];
  ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
  ctx.beginPath();
  for(let i=0;i<a.pts.length;i++){ const ang=i/a.pts.length*TAU, rr=a.r*a.pts[i];
    const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.closePath();
  const sh=ctx.createRadialGradient(-a.r*0.35,-a.r*0.35,a.r*0.1,0,0,a.r*1.15);
  sh.addColorStop(0, a.flash>0?'#fff':wd.rock);
  sh.addColorStop(1, a.flash>0?'#aaa':wd.dark);
  ctx.fillStyle=sh; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=2; ctx.stroke();
  for(const c of a.craters){ ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(c.x*a.r,c.y*a.r,c.r*a.r,0,TAU); ctx.fill(); }
  ctx.restore();
}

function drawEnemy(e){

  bg.addColorStop(0, e.flash>0?'#fff':'#e05545'); bg.addColorStop(1, e.flash>0?'#ccc':'#7a1f14');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(10,-13); ctx.lineTo(18,0); ctx.lineTo(10,13); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#ff8a7a'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#ffc0b0'; ctx.beginPath(); ctx.arc(-4,0,4,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,120,90,'+(0.5+0.4*Math.sin(tGlobal*20))+')';
  ctx.beginPath(); ctx.arc(-18,0,3.5,0,TAU); ctx.fill();
  ctx.restore();
}

function drawPower(p){
  const col=POWCOL[p.type];
  const pulse=1+0.12*Math.sin(p.ph);
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.fillStyle='rgba(10,14,30,0.85)';

  ctx.fillStyle=col; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText({shield:'S',rapid:'R',spread:'3X',health:'+',magnet:'M',boost:'»'}[p.type],0,1);

  ctx.fillStyle='#fff'; ctx.font='10px Arial'; ctx.textAlign='left'; ctx.textBaseline='bottom';

function applyVol(){ if(master)master.gain.value=SETTINGS.sfxVol; if(musicGain)musicGain.gain.value=SETTINGS.musicVol; }

function setState(s){ state=s; fade=1; }

function drawButtons(){
  const list=getButtons();
  list.forEach((b,i)=>{
    if(b.level!==undefined){ drawLevelCell(b); return; }
    const hov=mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
    const key=state+'_'+i;
    if(hov&&hoverKey!==key){hoverKey=key;sfx.hover();}
    if(!hov&&hoverKey===key)hoverKey='';
    const g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);
    if(b.accent){ g.addColorStop(0,hov?'#4aa8ff':'#2e7fd8'); g.addColorStop(1,hov?'#1d5aa8':'#123a6e'); }
    else { g.addColorStop(0,hov?'#38446e':'#232a44'); g.addColorStop(1,hov?'#1d2440':'#12172b'); }
    ctx.fillStyle=g; roundRect(b.x,b.y,b.w,b.h,10); ctx.fill();
    ctx.strokeStyle=b.accent?(hov?'#b8f4ff':'#7df9ff'):(hov?'#8fa4d8':'#4a5578');
    ctx.lineWidth=hov?2.5:2; roundRect(b.x,b.y,b.w,b.h,10); ctx.stroke();
    ctx.fillStyle=b.accent?'#eaf9ff':'#cfd8ee';
    ctx.font='bold 19px "Segoe UI",Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+1);
  });
  ctx.textBaseline='alphabetic';
}
function drawLevelCell(b){
  const hov=mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
  ctx.fillStyle=b.locked?'rgba(15,18,32,0.8)':(hov?'rgba(46,90,160,0.9)':'rgba(25,35,68,0.85)');
  roundRect(b.x,b.y,b.w,b.h,12); ctx.fill();
  ctx.strokeStyle=b.locked?'#333a55':(hov?'#9fd8ff':'#4a6ea8'); ctx.lineWidth=2; roundRect(b.x,b.y,b.w,b.h,12); ctx.stroke();
  ctx.textAlign='center';
  if(b.locked){
    ctx.font='26px Arial'; ctx.fillStyle='#5a6480';
    ctx.fillText('🔒',b.x+b.w/2,b.y+b.h/2-2);
    ctx.font='11px Arial'; ctx.fillStyle='#4a5470';
    ctx.fillText('COMPLETE PREVIOUS',b.x+b.w/2,b.y+b.h-12);
  } else {
    ctx.font='bold 26px Arial'; ctx.fillStyle='#eaf4ff';
    ctx.fillText('LEVEL '+(b.level+1),b.x+b.w/2,b.y+32);
    ctx.font='13px Arial'; ctx.fillStyle='#9fb8d8';
    ctx.fillText('GOAL  '+LEVELS[b.level].km+' km',b.x+b.w/2,b.y+52);
    const st=CAMPAIGN.stars[String(b.level)]||0;
    ctx.font='16px Arial';
    for(let s=0;s<3;s++){ ctx.fillStyle=s<st?'#ffd75a':'#3a4160'; ctx.fillText('★',b.x+b.w/2-22+s*22,b.y+72); }
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

  ctx.fillText('DISTANCE   '+km.toFixed(1)+' km',W/2,290);
  if(MODE==='endless'){
    if(newHigh){ ctx.fillStyle='#ffd75a'; ctx.font='bold 26px Arial'; ctx.fillText('★ NEW HIGH SCORE! ★',W/2,332); }
    else { ctx.fillStyle='#ffd75a'; ctx.font='20px Arial'; ctx.fillText('BEST  '+HIGH,W/2,330); }
  } else {
    ctx.fillStyle='#ffd75a'; ctx.font='20px Arial';
    ctx.fillText('LEVEL '+(lvlIdx+1)+'  —  target '+lvlTarget+' km',W/2,330);
  }
}
function drawLC(){
  ctx.textAlign='center';
  ctx.fillStyle='#6dff8a'; ctx.shadowColor='#2aff70'; ctx.shadowBlur=26;
  ctx.font='bold 56px "Segoe UI",Arial';
  ctx.fillText(lvlIdx+1>=LEVELS.length?'CAMPAIGN COMPLETE!':'LEVEL COMPLETE!',W/2,180);
  ctx.shadowBlur=0;
  // stars pop
  for(let i=0;i<3;i++){
    const delay=0.3+i*0.35;
    const sc=clamp((lcTime-delay)/0.25,0,1);
    if(sc>0 && lcStars>i && sc===1 && !drawLC['p'+i]){ drawLC['p'+i]=1; beep(880+i*220,.15,'triangle',.14); }
    const size=44*sc*(1+0.15*Math.sin(tGlobal*6+i));
    ctx.font='bold '+size+'px Arial';
    ctx.fillStyle=lcStars>i?'#ffd75a':'#39405c';
    ctx.fillText('★',W/2-70+i*70,275);
  }
  ctx.fillStyle='#fff'; ctx.font='bold 22px Arial';
  ctx.fillText('SCORE  '+Math.floor(score),W/2,340);
  ctx.fillStyle='#9fd8ff'; ctx.font='18px Arial';
  ctx.fillText('HULL REMAINING  '+Math.ceil(player.hp)+' / '+player.maxHp,W/2,370);
}
function drawMenuShips(){
  // decorative ships flying in menu background
  const sd=SHIPS[1];
  const x=W-200-((tGlobal*40)%(W+300));
  drawShipBody(x, 120+Math.sin(tGlobal)*10, sd, 0.8);
}

// ================= main loop =================
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  tGlobal+=dt;
  if(state==='lc') lcTime+=dt;
  update(dt);
  if(fade>0) fade=Math.max(0,fade-dt*2.5);
  ctx.setTransform(1,0,0,1,0,0);

  const inGame=(state==='playing'||state==='paused'||state==='over'||state==='lc');
  if(inGame){
    if(shake>0) ctx.setTransform(1,0,0,1,rand(-shake,shake),rand(-shake,shake));
    drawBG(false);
    if(state!=='over'){
      drawShip();
      for(const a of asteroids)drawAsteroid(a);
      for(const e of enemies)drawEnemy(e);
      for(const L of lasers){ ctx.fillStyle='#7df9ff'; ctx.fillRect(L.x-8,L.y-1.6,16,3.2);
        ctx.fillStyle='rgba(125,249,255,0.35)'; ctx.fillRect(L.x-14,L.y-3.5,28,7); }
      for(const b of ebullets){ ctx.fillStyle='#ff5a8a'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }
      for(const c of coins){ ctx.fillStyle='#ffd75a'; ctx.beginPath(); ctx.arc(c.x,c.y,c.r*(0.8+0.2*Math.abs(Math.sin(c.ph))),0,TAU); ctx.fill();
        ctx.strokeStyle='#b8860b'; ctx.lineWidth=1.5; ctx.stroke(); }
      for(const p of powerups)drawPower(p);
    }
    for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill(); }
    ctx.globalAlpha=1;
    for(const x of texts){ ctx.globalAlpha=Math.max(0,x.t); ctx.fillStyle=x.color;
      ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText(x.txt,x.x,x.y); }
    ctx.globalAlpha=1;
    ctx.setTransform(1,0,0,1,0,0);
    drawHUD();
    if(state==='paused'){
      ctx.fillStyle='rgba(0,0,10,0.6)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 46px "Segoe UI",Arial'; ctx.textAlign='center';
      ctx.fillText('PAUSED',W/2,240);
      drawButtons();
    }
    if(state==='over'){ ctx.fillStyle='rgba(0,0,10,0.55)'; ctx.fillRect(0,0,W,H); drawOver(); drawButtons(); }
    if(state==='lc'){ ctx.fillStyle='rgba(0,10,0,0.5)'; ctx.fillRect(0,0,W,H); drawLC(); drawButtons(); }
  } else {
    drawBG(true);
    if(state==='menu'){ drawMenuShips(); drawTitle(); drawButtons(); }
    else if(state==='levels'){ drawLevelsScreen(); drawButtons(); }
    else if(state==='hangar'){ drawHangar(); drawButtons(); }
    else if(state==='settings'){ drawSettings(); drawButtons(); }
    else if(state==='how'){ drawHow(); drawButtons(); }
  }
  if(fade>0){ ctx.fillStyle='rgba(0,0,0,'+(fade*0.8)+')'; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(loop);
}

// ================= input =================
const keys={};
const touch={move:false,fire:false,enabled:false,x:0,y:0};
function toGame(e){ const r=cvs.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }

window.addEventListener('keydown',e=>{
  initAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if((e.code==='KeyP'||e.code==='Escape')){
    if(state==='playing')setState('paused');
    else if(state==='paused')setState('playing');
  }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });

cvs.addEventListener('pointermove',e=>{
  const p=toGame(e); mouse.x=p.x; mouse.y=p.y;
  if(touch.move){ touch.x=p.x; touch.y=p.y; }
});
cvs.addEventListener('pointerdown',e=>{
  e.preventDefault(); initAudio();
  touch.enabled=true;
  const p=toGame(e); mouse.x=p.x; mouse.y=p.y;
  const list=getButtons();
  for(const b of list){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      if(b.level!==undefined && b.locked){ beep(180,.15,'square',.1); return; }
      b.action(); return;
    }
  }
  if(state==='playing'){
    const fx=W-76, fy=H-80;
    if(Math.hypot(p.x-fx,p.y-fy)<58) touch.fire=true;
    else { touch.move=true; touch.x=p.x; touch.y=p.y; }
  }
});
window.addEventListener('pointerup',()=>{ touch.move=false; touch.fire=false; });
window.addEventListener('pointercancel',()=>{ touch.move=false; touch.fire=false; });
cvs.addEventListener('contextmenu',e=>e.preventDefault());

requestAnimationFrame(loop);
})();
</script>
